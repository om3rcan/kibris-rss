# Kıbrıs RSS filtresi - ayarlar
#
# Her çalıştırmada aşağıdaki feed'ler indirilir, engel kurallarına uyan
# haberler çıkarılır ve temizlenmiş feed'ler GitHub Pages'te yayımlanır.
#
# Eşleştirme Türkçe karakterlerden bağımsızdır: "Spor", "SPOR", "spor",
# "Ünlüler" ve "unluler" aynı kabul edilir. Terimler kelime başından
# eşleşir: "spor" -> "Spor", "Spor Haberleri", "sporcu" yakalanır;
# "transport" yakalanmaz.

[filtre]

# 1) Haberin RSS kategorisi (<category>, <dc:subject>, Atom term)
#    bu terimlerden biriyle başlayan bir kelime içeriyorsa haber atılır.
kategori_engel = [
  "spor", "futbol", "basketbol", "voleybol", "hentbol", "tenis",
  "formula", "motor sporlari", "atletizm", "super lig", "birinci lig",
  "magazin", "unlu", "eglence", "dizi", "televizyon", "tv rehberi",
  "astroloji", "burc", "moda", "guzellik", "yasam stili",
]

# 2) Haber linkinin klasör kısmında (son parça hariç) bu terimlerden
#    biriyle başlayan bir bölüm varsa haber atılır.
#    Örn: site.com/spor/xyz-123 , site.com/kategori/magazin-haberleri/xyz
#    Haber başlığından üretilen son parça (slug) kontrol edilmez.
link_engel = [
  "spor", "futbol", "basketbol", "voleybol",
  "magazin", "unlu", "eglence", "dizi", "astroloji", "burc", "moda",
  "video", "foto-galeri", "galeri",
]

# 3) Başlıkta geçen kelimelere göre engelleme. Varsayılan olarak boş,
#    çünkü kelime eşleşmesi siyasi haberleri de yanlışlıkla atabilir.
#    Kategorisi ve linki olmayan kaynaklarda kaçan haberler olursa
#    buraya ekleyebilirsin. Örnek:
#    baslik_engel = ["mac sonucu", "transfer", "teknik direktor", "derbi"]
baslik_engel = []

# 4) Bu terimler kategoride geçiyorsa yukarıdaki kurallara rağmen
#    haber korunur. Örn: "Spor Bakanlığı" gibi siyasi haberler için
#    sitelerin "Siyaset" kategorisini de işaretlediği durumlar.
kategori_izin = []

# Fluent Reader'a aktarılacak OPML'deki klasör adı
opml_klasor = "Kıbrıs Haberler (Filtreli)"

